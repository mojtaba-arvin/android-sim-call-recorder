version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin-tooling:
        patterns:
          - "org.jetbrains.kotlin.*"
          - "com.google.devtools.ksp"
      dependency-injection:
        patterns:
          - "com.google.dagger:*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
