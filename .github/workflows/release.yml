name: Publish Android SDK AAR release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag reachable from main (for example v0.1.0-beta.1)
        required: true
        type: string
      confirm_publish:
        description: Explicitly publish the SDK AAR as a GitHub Release after the build succeeds
        required: true
        default: false
        type: boolean

# No permissions unless a job explicitly requires them.
permissions: {}

concurrency:
  group: android-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and assemble SDK AAR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out existing release tag without persisting credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag points to main history
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9.+-]*$ ]] || {
            echo "release_tag must be an existing version tag beginning with v." >&2
            exit 1
          }
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$TAG_COMMIT" FETCH_HEAD || {
            echo "Release tags must point to a commit reachable from main." >&2
            exit 1
          }
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "9.6.0"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"
      - name: Test, lint, and assemble release variants
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          gradle --no-daemon --console=plain \
            -PappVersion="$VERSION" \
            -PappVersionCode="$RELEASE_BUILD_NUMBER" \
            :callrecorder-sdk:testDebugUnitTest \
            :app:testDebugUnitTest \
            :callrecorder-sdk:lintDebug \
            :app:lintDebug \
            :callrecorder-sdk:lintRelease \
            :app:lintRelease \
            :app:compileDebugAndroidTestKotlin \
            :callrecorder-sdk:assembleRelease

          mkdir -p release-assets
          cp callrecorder-sdk/build/outputs/aar/callrecorder-sdk-release.aar "release-assets/callrecorder-sdk-$VERSION.aar"
          (cd release-assets && sha256sum *.aar > SHA256SUMS.txt)
          bash scripts/verify-sdk-release-assets.sh release-assets
      - name: Upload SDK AAR and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-sdk-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish SDK AAR
    needs: build
    if: ${{ inputs.confirm_publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified SDK AAR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-sdk-release-assets
          path: release-assets
      - name: Verify downloaded SDK AAR and checksum manifest
        run: bash scripts/verify-sdk-release-assets.sh release-assets
      - name: Publish SDK AAR and checksums to GitHub Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: SIM Call Recorder SDK ${{ inputs.release_tag }}
          tag_name: ${{ inputs.release_tag }}
          draft: false
          prerelease: ${{ contains(inputs.release_tag, '-alpha') || contains(inputs.release_tag, '-beta') || contains(inputs.release_tag, '-rc') }}
          generate_release_notes: true
          files: |
            release-assets/*.aar
            release-assets/SHA256SUMS.txt
