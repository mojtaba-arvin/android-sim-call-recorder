name: Android CI

on:
  push:
    branches:
      - main
      - "bootstrap/**"
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload diagnostic debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sim-call-recorder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
