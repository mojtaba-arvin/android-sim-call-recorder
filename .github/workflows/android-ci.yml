name: Android CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "README.md"
      - "docs/**"
  workflow_dispatch:
  # Documentation-only changes do not need a Gradle build or emulator boot.
  # Keep workflow/build/source changes covered by CI.
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "README.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer commit supersedes the old commit for the same PR/branch.
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Run unit tests, lint, and assemble debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload diagnostic debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sim-call-recorder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumented:
    name: Compose UI tests on Android emulator
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Run Compose UI tests on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Keep Quick Boot snapshots enabled; forcing cold boots added several minutes per PR run.
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-instrumented-test-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 7
