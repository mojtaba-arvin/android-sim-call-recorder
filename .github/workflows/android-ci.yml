name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    # PR #1 is the foundation branch for a short-lived stack. Run the same
    # required gate on dependent PRs targeting it; after foundation acceptance,
    # those PRs are retargeted to main and continue using this workflow.
    branches:
      - main
      - bootstrap/native-android-foundation
      - ci/parallel-emulator-gradle-cache
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs per PR/branch without killing an in-progress emulator job.
# GitHub keeps the newest pending run for the group; the active run finishes first.
# Do not include github.sha here: that would create a different group for every commit.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      audio: ${{ steps.filter.outputs.audio }}
    steps:
      - name: Check out history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test Android CI path classifier
        run: python -m unittest discover -s scripts/tests -p 'test_classify_android_ci_changes.py' -v

      - name: Verify multi-path classifier stdin handoff
        shell: bash
        run: |
          set -euo pipefail
          output="$(printf '%s\n' \
            'README.md' \
            'callrecorder-sdk/src/main/java/com/mojtaba/simcallrecorder/recording/shizuku/PrivilegedVoiceCallCaptureEngine.kt' \
            | python scripts/classify_android_ci_changes.py)"
          grep -Fxq 'code=true' <<< "$output"
          grep -Fxq 'audio=true' <<< "$output"

      - name: Classify changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER")"
          else
            # Manual runs and first pushes always execute the full verification pipeline.
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "audio=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$changed_files" | python scripts/classify_android_ci_changes.py >> "$GITHUB_OUTPUT"
          code_changed="$(grep '^code=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)"
          audio_changed="$(grep '^audio=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)"
          echo "Code/build changes: $code_changed"
          echo "Shizuku call-audio changes: $audio_changed"

  verify:
    name: SDK and app tests, lint, AAR, and debug APK
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2
        with:
          gradle-version: "9.6.0"
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Verify resolved AAR metadata and manifest merge
        run: gradle --console=plain :callrecorder-sdk:checkDebugAarMetadata :app:checkDebugAarMetadata

      - name: Verify sample app consumes only the SDK public boundary
        run: bash scripts/verify-sdk-boundary.sh

      - name: Test SDK release asset checksum verifier
        run: bash scripts/tests/verify-sdk-release-assets-test.sh

      - name: Test fail-closed physical two-way evidence validator
        run: python3 -m unittest discover -s scripts/tests -p 'test_physical_device_evidence_validator.py' -v

      - name: Test emulator logcat preflight fail-closed behavior
        run: bash scripts/tests/run-emulator-logcat-preflight-test.sh

      - name: Test bounded ADB restart for logcat recovery
        run: bash scripts/tests/run-adb-logcat-restart-test.sh

      - name: Test production APK signature verifier
        run: bash scripts/tests/test-apk-signature-verifier.sh

      - name: Verify production APK signing fails closed without secrets
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          if env -u ANDROID_KEYSTORE_PATH -u ANDROID_KEYSTORE_PASSWORD -u ANDROID_KEY_ALIAS -u ANDROID_KEY_PASSWORD \
            gradle --console=plain :app:packageRelease >"$output" 2>&1; then
            cat "$output"
            echo "Release signing guard unexpectedly accepted missing credentials." >&2
            exit 1
          fi
          grep -F "APP_RELEASE_SIGNING_INPUTS_MISSING" "$output"

      - name: Run focused multi-SIM snapshot regression
        run: timeout 180s gradle --console=plain :callrecorder-sdk:testDebugUnitTest --tests 'com.mojtaba.simcallrecorder.data.telephony.AndroidTelephonyCallStateDataSourceRobolectricTest.multipleSubscriptions_keepTheirOwnSlotAssociation'

      # The full SDK suite previously stopped after the DAO tests with no completed
      # report for stale-recovery or repository tests. Isolate these high-risk classes
      # first so the CI log identifies the exact test if a worker blocks again.
      - name: Isolate stale-recording recovery Robolectric tests
        run: timeout 120s gradle --info --console=plain :callrecorder-sdk:testDebugUnitTest --tests 'com.mojtaba.simcallrecorder.data.local.StaleRecordingRecoveryCallbackRobolectricTest'

      - name: Isolate recording repository Robolectric tests
        run: timeout 120s gradle --info --console=plain :callrecorder-sdk:testDebugUnitTest --tests 'com.mojtaba.simcallrecorder.data.repository.DefaultCallRecordRepositoryRobolectricTest'

      - name: Isolate Room DAO and migration Robolectric tests
        run: timeout 180s gradle --info --console=plain :callrecorder-sdk:testDebugUnitTest --tests 'com.mojtaba.simcallrecorder.data.local.CallRecordDaoRobolectricTest'

      - name: Isolate AudioRecord HAL reliability tests
        run: timeout 120s gradle --info --console=plain :callrecorder-sdk:testDebugUnitTest --tests 'com.mojtaba.simcallrecorder.recording.shizuku.AndroidVoiceCallCaptureEngineTest'

      - name: Run SDK unit tests with bounded execution
        run: timeout 15m gradle --info --console=plain :callrecorder-sdk:testDebugUnitTest

      - name: Run app unit tests, lint, and assemble artifacts
        run: gradle --continue --console=plain :callrecorder-sdk:checkDebugAarMetadata :app:checkDebugAarMetadata :app:testDebugUnitTest :callrecorder-sdk:lintDebug :app:lintDebug :callrecorder-sdk:assembleRelease :app:assembleDebug :sdk-consumer-smoke:assembleDebug

      - name: Upload unit test and lint reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: android-unit-lint-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            callrecorder-sdk/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            callrecorder-sdk/build/test-results/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
            callrecorder-sdk/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload SDK release AAR
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: callrecorder-sdk-release-aar
          path: callrecorder-sdk/build/outputs/aar/callrecorder-sdk-release.aar
          if-no-files-found: warn
          retention-days: 14

      - name: Upload diagnostic debug APK
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: sim-call-recorder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

  instrumented:
    name: Compose UI tests on Android emulator (API ${{ matrix.api-level }})
    # Run both emulator lanes alongside unit/lint/build verification. The required
    # aggregator still waits for every lane and fails closed; this removes the
    # verify -> emulator serial dependency from the critical path.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # API 24 is the declared software floor; API 26 covers Android 8 and API 35
        # covers the current Android 15 behavior. API 37 remains in Robolectric only.
        api-level: [24, 26, 35]

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Validate emulator harness shell syntax
        run: |
          bash -n scripts/ci/run-emulator-tests.sh
          bash -n scripts/run-process-death-emulator-tests.sh

      - name: Run Compose UI tests on Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          # Keep this as one physical command: the emulator runner invokes script lines separately.
          script: bash scripts/ci/run-emulator-tests.sh

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: compose-instrumented-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/emulator/**
          if-no-files-found: warn
          retention-days: 7

  android16-permission-probe:
    name: Android 16 Shell call-audio permission probe
    needs: [changes]
    if: needs.changes.outputs.audio == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Probe API 36 Shell permissions
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          # The emulator action executes each script line through /bin/sh. Keep the
          # bash invocation on one physical line so its quoted body is not split.
          script: |
            bash -c 'set -euo pipefail; shell_uid="$(adb shell id -u | tr -d "\\r")"; echo "adb shell uid=$shell_uid"; test "$shell_uid" = "2000"; package_dump="$(adb shell dumpsys package com.android.shell | tr -d "\\r")"; echo "$package_dump" | grep -F "android.permission.CALL_AUDIO_INTERCEPTION: granted=true"; echo "$package_dump" | grep -F "android.permission.CAPTURE_AUDIO_OUTPUT: granted=true"'

  required:
    name: Required checks
    if: always()
    needs: [changes, verify, instrumented, android16-permission-probe]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce CI policy
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          INSTRUMENTED_RESULT: ${{ needs.instrumented.result }}
          AUDIO_CHANGED: ${{ needs.changes.outputs.audio }}
          ANDROID16_RESULT: ${{ needs.android16-permission-probe.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]] || {
            echo "Change detection failed."
            exit 1
          }

          if [[ "$CODE_CHANGED" != "true" ]]; then
            echo "Documentation-only change: expensive Android jobs were intentionally skipped."
            exit 0
          fi

          [[ "$VERIFY_RESULT" == "success" ]] || {
            echo "Unit tests, lint, or APK assembly did not succeed: $VERIFY_RESULT"
            exit 1
          }
          [[ "$INSTRUMENTED_RESULT" == "success" ]] || {
            echo "Compose emulator tests did not succeed: $INSTRUMENTED_RESULT"
            exit 1
          }

          if [[ "$AUDIO_CHANGED" == "true" ]]; then
            [[ "$ANDROID16_RESULT" == "success" ]] || {
              echo "Android 16 Shell call-audio permission probe did not succeed: $ANDROID16_RESULT"
              exit 1
            }
          fi

          echo "All required Android CI checks passed."
