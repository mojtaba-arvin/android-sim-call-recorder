name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One active run per PR/branch. A newer commit supersedes the previous commit.
# Do not include github.sha here: that would create a different group for every commit.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER")"
          else
            # Manual runs and first pushes always execute the full verification pipeline.
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code_changed=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              *.md|docs/*) ;;
              *) code_changed=true; break ;;
            esac
          done <<< "$changed_files"

          echo "code=$code_changed" >> "$GITHUB_OUTPUT"
          echo "Code/build changes: $code_changed"

  verify:
    name: Unit tests, lint, and debug APK
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Run unit tests, lint, and assemble debug APK
        run: gradle --continue --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload unit test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-lint-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload diagnostic debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-call-recorder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

  instrumented:
    name: Compose UI tests on Android emulator (API ${{ matrix.api-level }})
    needs: [changes, verify]
    if: needs.changes.outputs.code == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # API 37 is covered by Robolectric for now. The current stable emulator-runner
        # bootstrap still requests platforms;android-37 (not the installed 37.2
        # extension package), so it cannot provision an API 37 AVD reliably.
        api-level: [26, 35]

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Run Compose UI tests on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Keep Quick Boot snapshots enabled; forcing cold boots added several minutes per PR run.
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            mkdir -p app/build/reports/emulator
            # Some API 26 emulator images reject logcat buffer clearing. Diagnostics are best-effort.
            adb logcat -c || true
            gradle --console=plain :app:connectedDebugAndroidTest
            test_exit_code=$?
            adb logcat -d -t 5000 > app/build/reports/emulator/logcat.txt || true
            adb shell dumpsys activity services > app/build/reports/emulator/services.txt || true
            adb shell dumpsys audio > app/build/reports/emulator/audio.txt || true
            exit "$test_exit_code"

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-instrumented-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/emulator/**
          if-no-files-found: warn
          retention-days: 7

  required:
    name: Required checks
    if: always()
    needs: [changes, verify, instrumented]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce CI policy
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          INSTRUMENTED_RESULT: ${{ needs.instrumented.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]] || {
            echo "Change detection failed."
            exit 1
          }

          if [[ "$CODE_CHANGED" != "true" ]]; then
            echo "Documentation-only change: expensive Android jobs were intentionally skipped."
            exit 0
          fi

          [[ "$VERIFY_RESULT" == "success" ]] || {
            echo "Unit tests, lint, or APK assembly did not succeed: $VERIFY_RESULT"
            exit 1
          }
          [[ "$INSTRUMENTED_RESULT" == "success" ]] || {
            echo "Compose emulator tests did not succeed: $INSTRUMENTED_RESULT"
            exit 1
          }

          echo "All required Android CI checks passed."
