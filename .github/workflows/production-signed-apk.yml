name: Build production-signed APK artifact

on:
  workflow_dispatch:
    inputs:
      confirm_signing:
        description: Explicitly authorize a signed internal APK artifact build (does not publish a release)
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: production-signed-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Sign, verify, and retain internal APK artifact
    if: github.ref == 'refs/heads/main' && inputs.confirm_signing == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production-signing
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_SIGNING_CERT_SHA256: ${{ secrets.EXPECTED_SIGNING_CERT_SHA256 }}
    steps:
      - name: Check out main without persisting credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Verify signing inputs and materialize keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD EXPECTED_SIGNING_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "APP_RELEASE_SIGNING_INPUTS_MISSING: required environment secret $name is not configured." >&2
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/production-signing.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          [[ -s "$keystore_path" ]] || {
            echo "APP_RELEASE_KEYSTORE_NOT_FOUND: decoded keystore is empty." >&2
            exit 1
          }
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Add Android build-tools to PATH
        run: echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Build production-signed APK
        run: gradle --no-daemon --console=plain :app:assembleRelease

      - name: Verify APK signature and approved certificate fingerprint
        run: bash scripts/verify-apk-signature.sh app/build/outputs/apk/release/app-release.apk

      - name: Remove ephemeral signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/production-signing.keystore"

      - name: Upload signed internal APK artifact (no GitHub Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: production-signed-app-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
