name: Agent system contracts

on:
  push:
    branches: [main, bootstrap/native-android-foundation]
    paths:
      - "AGENTS.md"
      - "agent-system/**"
      - "docs/RD_AGENT_CHARTER.md"
      - "docs/RD_AGENT_TASK_CONTRACT.md"
      - "scripts/validate_agent_system.py"
      - ".github/workflows/agent-system-validation.yml"
  pull_request:
    branches: [main, bootstrap/native-android-foundation]
    paths:
      - "AGENTS.md"
      - "agent-system/**"
      - "docs/RD_AGENT_CHARTER.md"
      - "docs/RD_AGENT_TASK_CONTRACT.md"
      - "scripts/validate_agent_system.py"
      - ".github/workflows/agent-system-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-system-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate agent contracts and evidence references
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Test agent-system validator
        run: python -m unittest discover -s scripts/tests -p 'test_validate_agent_system.py' -v

      - name: Validate agent instructions, tool grants, and benchmark provenance
        run: python scripts/validate_agent_system.py

      - name: Test orchestrator state machine and execution ledger
        run: python -m unittest discover -s agent-system/tests -p 'test_*.py' -v
