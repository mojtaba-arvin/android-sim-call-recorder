[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.14"
hilt = "2.60.1"
compose-bom = "2026.11.01"
room = "2.8.5"
coroutines = "1.11.0"
activity = "1.13.0"
lifecycle = "2.11.0"
